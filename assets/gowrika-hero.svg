<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="gm-title gm-desc">
  <title id="gm-title">Gowrika Mahesh</title>
  <desc id="gm-desc">Data Analytics and AI, Agentic AI, GenAI Systems, ML</desc>
  <defs>
    <linearGradient id="gm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="gm-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gm-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
    </linearGradient>
    <linearGradient id="gm-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="gm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#C77B9B" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="gm-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#gm-bg)"/>
  <rect width="1200" height="360" fill="url(#gm-grid)"/>

  <!-- Moving light -->
  <ellipse cx="900" cy="120" rx="320" ry="200" fill="url(#gm-glow)">
    <animate attributeName="cx" values="820;980;820" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;150;110" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbital geometry -->
  <g transform="translate(980 180)" fill="none" stroke="#C77B9B" stroke-opacity="0.35">
    <circle r="110" stroke-width="1"/>
    <circle r="70" stroke-width="1" stroke-opacity="0.25"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <ellipse rx="150" ry="48" stroke-width="1"/>
      <circle cx="150" cy="0" r="5" fill="#E5B5C7" stroke="none"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="26s" repeatCount="indefinite"/>
      <circle cx="110" cy="0" r="4" fill="#C77B9B" stroke="none"/>
    </g>
  </g>

  <!-- Animated path (fully drawn when motion is unavailable) -->
  <path d="M60 330 C 220 305, 300 350, 460 322 S 700 270, 820 305 S 1040 350, 1140 322"
        fill="none" stroke="#C77B9B" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-opacity="0.85">
    <animate attributeName="stroke-dasharray" values="0 1;1 0" dur="4s" fill="freeze"/>
  </path>
  <circle r="5" fill="#E5B5C7">
    <animateMotion dur="8s" repeatCount="indefinite" path="M60 330 C 220 305, 300 350, 460 322 S 700 270, 820 305 S 1040 350, 1140 322"/>
  </circle>

  <!-- Corner technical marks -->
  <g stroke="#C77B9B" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M30 60V30H60"/>
    <path d="M1170 300V330H1140"/>
  </g>

  <!-- Text -->
  <text x="70" y="108" font-family="Helvetica, Arial, sans-serif" font-size="14" letter-spacing="6" fill="#C77B9B">PORTFOLIO • GITHUB PROFILE</text>
  <text x="68" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" fill="url(#gm-name)">Gowrika Mahesh</text>

  <!-- Glowing underline -->
  <rect x="70" y="212" width="440" height="4" rx="2" fill="#C77B9B" opacity="0.6" filter="url(#gm-blur)"/>
  <rect x="70" y="212" width="440" height="3" rx="1.5" fill="url(#gm-line)">
    <animate attributeName="width" values="40;440" dur="2.5s" fill="freeze"/>
  </rect>

  <text x="70" y="252" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#E5B5C7">Data Analytics &amp; AI  |  Agentic AI  |  GenAI Systems  |  ML</text>
  <text x="70" y="284" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#C77B9B" fill-opacity="0.9">Heidelberg, Germany</text>
</svg>
